name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      # If you uploaded the zip itself (or the project sits in a subfolder), find the project automatically
      - name: Locate project
        run: |
          if [ ! -f build.gradle ] && [ -f shototo_mod.zip ]; then unzip -oq shototo_mod.zip -d _unzipped; fi
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -n 1)")
          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: shototo-shotgun-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
